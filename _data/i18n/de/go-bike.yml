hero-title: "Willkommen zur senseBox:bike"
hero-text: "Die senseBox:bike verwandelt dein Fahrrad in einen mobilen Umweltsensor. Damit kannst du während deiner Fahrt spannende Daten über deine Umgebung sammeln und Projekte rund um Umweltüberwachung und Nachhaltigkeit unterstützen."

programming-title: "App herunterladen"
programming-text: "Mit unserer senseBox:bike-App kannst du dich ganz einfach mit deiner senseBox:bike verbinden und deine Umweltdaten in Echtzeit auf einer interaktiven Karte verfolgen."

sketch-title: "Sketch herunterladen"
sketch-text: "Lade den aktuellen Sketch für deine senseBox:bike herunter und spiele ihn auf dein Board."
sketch-button: "Zum Download"

materials-title: "Lernmaterialien"
materials-text: "Entdecke unsere Materialien, um noch mehr aus deiner senseBox herauszuholen."
materials-button-quickstart: "Schnellstartanleitung"
materials-button-assembly: "Aufbauanleitung"

