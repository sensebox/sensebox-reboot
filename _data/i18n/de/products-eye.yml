eye-camera-title: "Kamera onboard"
eye-camera-text: "Das Herzstück der senseBox:eye ist die integrierte Kamera. Nimm Bilder auf und verarbeite sie direkt auf dem Board - ganz ohne externe Module."

eye-ml-title: "Maschinelles Lernen kinderleicht"
eye-ml-text: "Lerne mit der senseBox:eye Schritt für Schritt, wie maschinelles Lernen funktioniert. Trainiere eigene KI-Modelle direkt im Browser und übertrage sie auf das Board. Ob Bildklassifikation oder Zaubersprucherkennung – die kleine aber leistungsstarke Hardware macht es möglich, neuronale Netze direkt auf dem Gerät auszuführen."
eye-ml-button: "Jetzt ausprobieren"

eye-usecases-title: "Spannende Anwendungsmöglichkeiten"
eye-usecases-bird-title: "Vögel erkennen"
eye-usecases-bird-text: "Im Rahmen des Forschungsprojekts '<a href=\"/de/research-tinyaiot.html\">TinyAIoT</a>' und aufbauend auf dem '<a href=\"https://wiediversistmeingarten.org/\" target=\"_blank\">Birdiary</a>' Projekt konnte die senseBox:eye bereits zur Erkennung heimischer Vögel an einem Futterhaus eingesetzt werden. Dank des leistungsfähigen Prozessors können die Bilder direkt auf dem Gerät klassifiziert werden und somit eine Übertragung an externe Server vermieden werden. Das spart Strom und schützt die Privatsphäre."
eye-usecases-bee-title: "Hummeln zählen"
eye-usecases-bee-text: "Im Rahmen eines Studienprojekts aam Institut für Geoinformatik der Universität Münster konnten Studierende die senseBox:eye zur Zählung der Ein- und Ausflüge von Hummeln an einem Brutkasten einsetzen. Dank des kleinen Formfaktors minimalinvasiv, ohne Störung der Tiere."

