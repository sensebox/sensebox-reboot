eye-interest-title: "Du bist an der senseBox:eye interessiert?"
eye-interest-text: "Dann melde dich per Mail an <a href=\"mailto:kontakt@reedu.de\">kontakt@reedu.de</a>. Wir melden uns dann bei dir, sobald die senseBox:eye auf dem Markt ist. Sie wird voraussichtlich ab Herbst/Winter 2026 im <a href=\"https://sensebox.kaufen/\">Shop</a> verfügbar sein!"
