eye-interest-title: "Are you interested in the senseBox:eye?"
eye-interest-text: "Then contact us at <a href=\"mailto:kontakt@reedu.de\">kontakt@reedu.de</a>. We will get back to you as soon as the senseBox:eye is available. It is expected to be available in the <a href=\"https://sensebox.kaufen/\">shop</a> from Fall/Winter 2026!"