eye-camera-title: "Camera onboard"
eye-camera-text: "The heart of the senseBox:eye is the integrated camera. Capture images and process them directly on the board - without any external modules."

eye-ml-title: "Machine Learning Made Easy"
eye-ml-text: "Learn step by step how machine learning works with the senseBox:eye. Train your own AI models directly in the browser and transfer them to the board. Whether image classification or magic spell recognition – the small but powerful hardware makes it possible to run neural networks directly on the device."
eye-ml-button: "Try it now"

eye-usecases-title: "Exciting Use Cases"
eye-usecases-bird-title: "Recognizing birds"
eye-usecases-bird-text: "As part of the '<a href=\"/en/research-tinyaiot.html\">TinyAIoT</a>' research project and building on the '<a href=\"https://wiediversistmeingarten.org/\" target=\"_blank\">Birdiary</a>' project, the senseBox:eye has already been used to recognize local birds at a feeding station. Thanks to the powerful processor, images can be classified directly on the device, avoiding transmission to external servers. This saves power and protects privacy."
eye-usecases-bee-title: "Counting bumblebees"
eye-usecases-bee-text: "As part of a student project at the Institute of Geoinformatics at the University of Münster, students were able to use the senseBox:eye to count bumblebees entering and leaving a nesting box. Thanks to the small form factor, it's minimally invasive without disturbing the sensitive animals."

